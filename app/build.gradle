plugins {
    id 'com.android.application'
}

android {
    namespace 'id.bram.tvtamubox'
    compileSdk 34

    defaultConfig {
        applicationId "id.bram.tvtamubox"
        minSdk 24            // Android 7 ke atas (mesin browser bawaannya bisa diperbarui)
        targetSdk 34
        versionCode 10
        versionName "1.9"
    }

    // Kunci tanda tangan tetap (ikut di repo), supaya versi berikutnya bisa dipasang menimpa versi lama
    // tanpa menghapus tulisan dan latar yang tersimpan di box.
    signingConfigs {
        debug {
            storeFile file('tvtamu.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
